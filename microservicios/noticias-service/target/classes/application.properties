spring.application.name=noticias-service

# Servidor
server.port=8085
server.error.include-message=always

# Base de datos MySQL (Laragon). Se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/vet_noticias?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: las tablas las crea Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Swagger UI: http://localhost:<puerto>/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
