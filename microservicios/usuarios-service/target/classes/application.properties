spring.application.name=usuarios-service

# Servidor
server.port=8083
server.error.include-message=always

# Base de datos MySQL (Laragon). Se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/vet_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: las tablas las crea Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Swagger UI: http://localhost:<puerto>/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# JWT: clave secreta compartida por los 4 microservicios (mínimo 32 caracteres).
# En un entorno real se entrega con la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:clave-secreta-veterinaria-san-marcos-2026-jwt}
# Duración del token en horas
jwt.horas-expiracion=2
